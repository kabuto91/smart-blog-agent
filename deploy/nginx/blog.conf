# Nginx 反向代理配置 —— smart-blog-agent 前台博客
#
# 部署方式（在服务器上执行）：
#   sudo cp deploy/nginx/blog.conf /etc/nginx/conf.d/blog.conf
#   # 把下面 server_name 改成你的域名（或先用 IP 测试，改成 default_server）
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置条件：
#   - Node 服务已由 PM2 起在 127.0.0.1:3000（见 deploy/ecosystem.config.js）
#   - 轻量应用服务器防火墙已放行 80/443
#
# HTTPS：先用 HTTP 验证跑通，再申请证书（腾讯云免费证书 / certbot）。
# 证书就绪后取消文末 HTTPS server 块的注释，并启用 HTTP 强制跳转。

# 上游：Next.js 生产服务
upstream blog_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP —— 初期验证用；HTTPS 配好后改为强制跳转
server {
    listen 80;
    listen [::]:80;

    # ★ 改成你的域名；若暂用 IP 测试，可写 default_server 或服务器 IP
    server_name blog.example.com;

    # HTTPS 就绪后启用下面这行，强制跳 HTTPS：
    # return 301 https://$host$request_uri;

    # 与 Next.js 上传接口匹配（图片上传）
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    location / {
        proxy_pass http://blog_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接支持（主题生成流式预览走 SSE）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next.js 静态资源：长缓存
    location /_next/static/ {
        proxy_pass http://blog_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 上传资源
    location /api/uploads/ {
        proxy_pass http://blog_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
    }

    # 常见扫描器路径直接拒掉
    location ~* \.(env|git|sql|bak)$ {
        return 404;
    }
}

