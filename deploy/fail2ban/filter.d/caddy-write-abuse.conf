# Caddy 写接口滥用检测
# 匹配 Caddy JSON access log（站点块 log 指令产出）里对 /api/articles/*/like 与 */read 的 POST
# 日志格式示例：
# {"level":"info","ts":1793090257.17,"logger":"http.log.access.log0","msg":"handled request",
#  "request":{"remote_ip":"1.2.3.4","client_ip":"1.2.3.4","method":"POST","uri":"/api/articles/x/read"},...}
# 日期取自行内 resp_headers 的 Date 头（RFC1123），由 fail2ban 默认日期探测器识别；
# 不设 datepattern——%s/Epoch 写法对浮点 ts 无法解析（re.error 组名冲突 / 不匹配）。
# 每条匹配计 1 次，超阈值封禁（阈值在 jail.local 里配）。

[Definition]
failregex = "client_ip"\s*:\s*"<HOST>".*"method"\s*:\s*"POST".*"uri"\s*:\s*"/api/articles/[^"]+/(like|read)"
